<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SKELETON</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/socals-style.css" />
  </head>

  <body>
    <site-navbar></site-navbar>
    <!-- Add data entry stuff here :) -->

    <div class="container">
      <div class="friend-buttons row">
        <div class="numOfUsersFriends col-6">
          <h1>Other users:</h1>
        </div>
      </div>
    </div>

    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
      <button class="btn btn-success" type="submit">Search</button>
    </form>

    <div id="friendsFriendslist">
      <template id="userCardTemplate">
        <style>
          .card, .friendPage, .text-center, .w-100 {
            margin-top: 1%;
          }

          .card, .friendPage {
            color: #3B2F23;
            border-color: #AF8A68;
            background-color: #AF8A68;
          }

          button:hover {
            color: #AF8A68;
            border-color: #3B2F23;
            background-color: #3B2F23;
          }
        </style>
        <button class="card friendPage text-center w-100">
          <span class="userName">Name</span>
          <span class="numTournaments">Tournaments: </span>
        </button>
      </template>
    </div>

    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->
    <script type="module" src="./src/firebaseConfig.js"></script>
    <script type="module" src="./src/authentication.js"></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/add-friend.js"></script>
  </body>
</html>
