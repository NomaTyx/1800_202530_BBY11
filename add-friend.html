<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SKELETON</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>
    <site-navbar></site-navbar>
    <!-- Add data entry stuff here :) -->
    <div class="col">
      <div class="card">
        <div class="row g-0">
          <div class="d-flex justify-content-center User_profile col-md-4">
            <img src="/images/chess-placeholder.svg" alt="profile_picture" />
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title Username" id="socialsUserName"></h5>
              <p id="Bio" class="card-text">"bio messege could go here"</p>
            </div>
            <div class="settings-button"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="friend-buttons row">
        <div class="numOfUsersFriends col-6">
          <img src="/images/chess-placeholder.svg" alt="friends-icon" />
          <p>Friends(21)</p>
        </div>
      </div>
    </div>

    <div class="row">
      <div id="friendsFriendslist" class="card">
        <template id="FriendsOfFriend">
          <div class="row friend-card col-6">
            <img
              class="card-image col-4 img-fluid"
              src="public\images\chess-placeholder.svg"
              alt="profile"
            />
            <div class="friendPage col-12 text-end">
              <a href="#">
                <span class="userName">Name</span>
              </a>
            </div>
          </div>
        </template>
      </div>
    </div>

    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>

    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->
    <script type="module" src="./src/firebaseConfig.js"></script>
    <script type="module" src="./src/authentication.js"></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/add-friend.js"></script>
  </body>
</html>
