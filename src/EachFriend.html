<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Socials</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
    <script type="module" src="/src/components/friendCard.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/socals-style.css" />
  </head>
  <!-- profilePicture, username, bio, friendsList, numOfFriends (friendsList.size) -->
  <body>
    <site-navbar></site-navbar>

    <div class="col">
      <div class="card">
        <div class="user-info row g-0">
          <div class="d-flex justify-content-center User_profile col-md-4">
            <img
              id="profilePicture"
              src="/images/chess-placeholder.svg"
              alt="profilePicture"
              class="rounded-circle bg-white"
            />
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 id="userName" class="card-title">user name here</h5>
              <div class="bio-box card">
                <p id="bio" class="card-text">"bio messege could go here"</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- get a tornament component -->
    <div class="tornament"></div>

    <!-- will have to get a friend component for each friend listing -->
    <div class="container">
      <div class="friend-buttons row">
        <div class="col-6">
          <img src="/images/chess-placeholder.svg" alt="friends-icon" />
          <p id="numOfFriends">Friends(21)</p>
        </div>
      </div>
      <!--  Dont need this, don't need to display friends.
      <div class="container row">
        <friend-card></friend-card>
        <friend-card></friend-card>
        <friend-card></friend-card>
      </div> -->
    </div>

    <!-- Link to scripts of your own -->
    <script type="module" src="/src/EachFriend.js"></script>
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/main.js"></script>
    <!-- <script type="module" src="./src/socals.js"></script> -->
  </body>
</html>
