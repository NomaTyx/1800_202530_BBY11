<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Socials</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
    <script type="module" src="/src/components/friendCard.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <site-navbar></site-navbar>

    <!-- Add data entry stuff here :) -->
    <div class="col">
      <div class="card">
        <div class="row g-0">
          <div class="d-flex justify-content-center User_profile col-md-4">
            <img src="/images/chess-placeholder.png" alt="profile_picture" />
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title Username">username here</h5>
              <p class="card-text">"bio messege could go here"</p>
            </div>
            <div class="settings-button"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- get a tornament componet -->
    <div class="tornament"></div>

    <div class="container">
      <div class="friend-buttons row">
        <div class="col-6">
          <img src="/images/chess-placeholder.png" alt="friends-icon" />
          <p>Friends(21)</p>
        </div>

        <div class="col-6">
          <img src="/images/chess-placeholder.png" alt="friends-icon" />
          <a href="add-friend.html" id="add_friend">Add Friends</a>
        </div>
      </div>
    </div>

    <div class="container gap-2">
      <div id="friendsGoHere"></div>
    </div>

    <template id="socialsCardTemplate">
      <div class="row friend-card col-6">
        <img
          class="card-image col-4 img-fluid"
          src="public\images\chess-placeholder.png"
          alt="profile"
        />
        <div class="friendPage col-12 text-end">
          <a href="#">
            <span class="userName">Name</span>
          </a>
        </div>
      </div>
    </template>

    <!---------------------------------------------->
    <!-- JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/firebaseConfig.js"></script>
    <script type="module" src="./src/authentication.js"></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/socals.js"></script>
  </body>
</html>
