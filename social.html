<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Socials</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <meta charset="utf-8" />

    <!-- Other libraries go here -->

    <!-- Link to styles of your own -->

        <div class="col">
          <img src="/images/chess-placeholder.png" alt="friends-icon" />
