<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Socials</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
    <script type="module" src="/src/components/friendCard.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/socals-style.css" />
  </head>

  <body>
    <site-navbar></site-navbar>

    <!-- Add data entry stuff here :) -->
    <div class="col" id="userNameplusBio">
      <div class="card">
        <div class="user-info row g-0">
          <div class="d-flex justify-content-center User_profile col-md-4">
            <img
              src="/images/chess-placeholder.svg"
              alt="profile_picture"
              class="rounded-circle bg-white"
            />
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title Username">Username here</h5>
              <div class="bio-box card">
                <p class="bioMsg card-text">"bio messege could go here"</p>
              </div>
            </div>
            <div class="settings-button text-end">
              <a href="friend-settings.html"
                ><img src="/images/settingsCog.svg" alt="settings_cog"
              /></a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- get a tornament componet -->
    <div class="tornament"></div>

    <div class="container">
      <div class="friend-buttons row">
        <div id="friendNum" class="col-6">
          <img src="/images/chess-placeholder.svg" alt="friends-icon" />
          <span class="hey"><p>Friends(21)</p></span>
        </div>

        <!-- change button maybe to a anchor styled like a button, maybe better styling. -->
        <button
          type="button"
          onclick="location.href='add-friend.html'"
          class="col-6 bg-white"
        >
          <div class="col-6 bg-white">
            <img src="/images/chess-placeholder.svg" alt="friends-icon" />
            <a href="add-friend.html" id="add_friend">Add Friends</a>
          </div>
        </button>
      </div>
    </div>

    <div class="container">
      <div id="friendsGoHere"></div>
    </div>

    <template id="socialsCardTemplate">
      <div class="row friend-card p-3 border mb-3">
        <img
          class="card-image col-2 img-fluid"
          src="public\images\chess-placeholder.svg"
          alt="profile"
        />
        <div
          class="friendPage col-8 d-flex justify-content-center align-items-center"
        >
          <a href="#">
            <span class="userName">Name</span>
          </a>
        </div>
      </div>
    </template>

    <!---------------------------------------------->
    <!-- JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/firebaseConfig.js"></script>
    <script type="module" src="./src/authentication.js"></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/socals.js"></script>
  </body>
</html>
