<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Socials</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
    <script type="module" src="/src/components/friendCard.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/socals-style.css" />
  </head>

  <body>
    <site-navbar></site-navbar>
    <!-- bar that displays your username and bio and settings-->
    <div class="card">
      <div class="user-info row g-0">
        <div class="col-md-10">
          <div class="card-body">
            <div id="myModal" class="modal">
              <div class="modal-content">
                <span class="close">&times;</span>
                <div class="modal-header">
                  <h2>Enter Information</h2>
                </div>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Edit name:" />
                <label for="bio">Bio:</label>
                <input type="text" id="bio" placeholder="Edit bio:" />
                <div class="modal-footer">
                  <button class="btn btn-warning" id="submitBtn">Submit</button>
                </div>
              </div>
            </div>
            <h5 class="card-title Username" id="usernameDisplay">Username here</h5>
            <div id="biobox" class="bio-box card">
              <p id="bioText" class="card-text">"bio message could go here"</p>
            </div>
          </div>
        </div>
        <!-- For Editing the User's Profile -->
        <div class="col">
          <button class="btn btn-warning" id="editProfile">
            <img src="/images/settingsCog.svg" alt="settings_cog" />
            Edit profile
          </button>
        </div>
      </div>
    </div>

    <div class="container align-items-center justify-content-center">
      <!-- get a tournament component -->
      <div class="tournamentContainer"></div>

      <div class="friend-buttons row">
        <div id="friendNum" class="col-9">
          <h1 id="numFriendsText">Friends(__)</h1>
        </div>
        <button type="button" onclick="location.href='add-friend.html'" class="btn btn-warning">
          <img src="/images/chess-placeholder.svg" alt="friends-icon" />
          Add Friends
        </button>
      </div>
      <div id="friendsGoHere"></div>

      <!-- template for cards-->
      <template id="socialsCardTemplate">
        <style>
          #friendCard {
            margin-top: 1%;
            border-radius: 10px;
            background-color: #AF8A68 !important;

            img {
              background-color: #ECDAB9;
              border-radius: 10px;
              margin-right: 2%;
            }

            #friendProfileButton {
              border-style: none;
              background-color: transparent;
            }
          }

          #friendCard:hover {
            border-color: #3B2F23 !important;
            background-color: #3B2F23 !important;

            #friendProfileButton {
              color:#AF8A68;
            }
          }
        </style>
        <div class="row p-3 border mb-3" id="friendCard">
          <img
            class="card-image col-2 img-fluid"
            src="public\images\uct-logo.svg"
            alt="profile"
          />
          <button
            id="friendProfileButton"
            class="friendPage col-8 d-flex justify-content-center align-items-center"
          >
            <h2 class="userName">Name</h2>
          </button>
        </div>
      </template>
    </div>

    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/firebaseConfig.js"></script>
    <script type="module" src="./src/authentication.js"></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/socals.js"></script>
  </body>
</html>
