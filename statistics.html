<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Data Entry Screen</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->
    <site-navbar></site-navbar>

    <!-- Add data entry stuff here :) -->
    <!-- <img src="..." class="rounded mx-auto d-block" alt="..."> -->
    <div class="container text-center">
      <button type="button" class="btn btn-warning btn-lg">White</button>
      <button type="button" class="btn btn-warning btn-lg">Black</button>

      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="floatingStartDate">
        <label for="floatingInput">Start Date</label>
      </div>
      <div class="form-floating">
        <input type="date" class="form-control" id="floatingEndDate">
        <label for="floatingPassword">End Date</label>
      </div>
    </div>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
