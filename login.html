<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->
    <!-- Alerts -->
    <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

    <div class="container col-xl-10 col-xxl-8 px-4 py-5">
      <div class="row align-items-center g-lg-5 py-5">
        <!-- site tagline-->
        <div class="col-lg-7 text-center text-lg-start">
          <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">
            The universal chess tracker.
          </h1>
          <p class="col-lg-10 fs-4">Save your life by tracking your chess tournaments today.</p>
        </div>

        <!-- Login -->
        <div class="col-md-10 mx-auto col-lg-5">
          <div id="loginView">
            <h3 class="mb-3 text-center">Login</h3>
            <form id="loginForm" class="p-4 p-md-5 border rounded-3 bg-body-tertiary" novalidate>
              <div class="mb-3">
                <input
                  type="email"
                  id="loginEmail"
                  class="form-control"
                  placeholder="Email"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  id="loginPassword"
                  class="form-control"
                  placeholder="Password"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <small class="d-block mt-3 text-center">
              Don’t have an account?
              <a href="#" id="toSignup">Sign up</a>
            </small>
          </div>

          <!-- Signup -->
          <div id="signupView" class="d-none">
            <h3 class="mb-3 text-center">Sign Up</h3>
            <form id="signupForm" class="p-4 p-md-5 border rounded-3 bg-body-tertiary" novalidate>
              <div class="mb-3">
                <input
                  type="text"
                  id="signupName"
                  class="form-control"
                  placeholder="First and Last Name"
                  aria-label="Full name"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="email"
                  id="signupEmail"
                  class="form-control"
                  placeholder="Email"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  id="signupPassword"
                  class="form-control"
                  placeholder="Password"
                  required
                />
              </div>
              <button type="submit" class="btn btn-success w-100">Create Account</button>
            </form>
          </div>
          <small class="d-block mt-3 text-center">
            Already have an account?
            <a href="#" id="toLogin">Login</a>
          </small>
        </div>
      </div>
    </div>
    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <!-- The order of loading matters -->
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/loginSignup.js"></script>
  </body>
</html>
